<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — PhotoCraft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #f0f0f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { background: #151515; border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 2.5rem; width: 100%; max-width: 380px; text-align: center; }
    .logo { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem; }
    .logo span { color: #6c8cff; }
    h1 { font-size: 1.25rem; margin-bottom: 0.75rem; }
    p { color: #888; font-size: 0.875rem; margin-bottom: 1.5rem; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(108,140,255,0.15); border-top-color: #6c8cff; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 1rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn { display: inline-block; padding: 0.7rem 1.5rem; border-radius: 8px; font-size: 0.9rem; font-weight: 500; background: #6c8cff; color: #fff; border: none; cursor: pointer; margin-top: 1rem; text-decoration: none; }
    .btn:hover { opacity: 0.85; }
    .error { color: #ff8a8a; font-size: 0.875rem; margin-top: 0.5rem; }
    .success-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
<div class="box">
  <div class="logo">Photo<span>Craft</span></div>
  <div id="state-loading">
    <div class="spinner"></div>
    <p>Verifying your email…</p>
  </div>
  <div id="state-success" style="display:none">
    <div class="success-icon">✅</div>
    <h1>Email Verified!</h1>
    <p>Your account is ready. Sign in to start uploading.</p>
    <a href="/app.html" class="btn">Go to PhotoCraft</a>
  </div>
  <div id="state-error" style="display:none">
    <div class="success-icon">❌</div>
    <h1>Verification Failed</h1>
    <p id="error-msg">This link may be expired or already used.</p>
    <a href="/app.html" class="btn">Back to Sign In</a>
  </div>
</div>

<script>
  // Environment detection — MANDATORY for standalone pages (pitfall #36)
  const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? 'http://localhost:3000'
    : 'https://7crb0oaiba.execute-api.us-east-1.amazonaws.com';

  async function verify() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (!token) {
      showError('No verification token found in URL.');
      return;
    }
    try {
      const res = await fetch(`${API_URL}/api/auth/verify-email`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Verification failed');

      // Auto-login if token returned
      if (data.token && data.user) {
        localStorage.setItem('photocraft_token', data.token);
        localStorage.setItem('photocraft_user', JSON.stringify(data.user));
      }

      document.getElementById('state-loading').style.display = 'none';
      document.getElementById('state-success').style.display = 'block';
    } catch (err) {
      showError(err.message || 'Verification failed');
    }
  }

  function showError(msg) {
    document.getElementById('state-loading').style.display = 'none';
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('state-error').style.display = 'block';
  }

  verify();
</script>
</body>
</html>
