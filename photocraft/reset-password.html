<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — PhotoCraft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #f0f0f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { background: #151515; border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 2.5rem; width: 100%; max-width: 380px; }
    .logo { text-align: center; font-size: 1.3rem; font-weight: 700; margin-bottom: 1.75rem; }
    .logo span { color: #6c8cff; }
    h1 { font-size: 1.15rem; margin-bottom: 0.5rem; }
    p.sub { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 0.4rem; }
    input[type="password"] { width: 100%; padding: 0.7rem 0.9rem; background: #1e1e1e; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #f0f0f0; font-size: 0.9rem; }
    input:focus { outline: none; border-color: #6c8cff; }
    .btn { width: 100%; padding: 0.7rem; border-radius: 8px; font-size: 0.9rem; font-weight: 500; background: #6c8cff; color: #fff; border: none; cursor: pointer; }
    .btn:hover { opacity: 0.85; }
    .msg { padding: 0.65rem 0.9rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .msg-error { background: rgba(255,77,79,0.12); border: 1px solid rgba(255,77,79,0.3); color: #ff8a8a; }
    .msg-success { background: rgba(82,196,26,0.1); border: 1px solid rgba(82,196,26,0.3); color: #73d13d; }
    .back-link { display: block; text-align: center; margin-top: 1rem; font-size: 0.8rem; color: #6c8cff; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>
<div class="box">
  <div class="logo">Photo<span>Craft</span></div>
  <h1>Reset Your Password</h1>
  <p class="sub">Enter a new password below.</p>
  <div id="msg-error" class="msg msg-error"></div>
  <div id="msg-success" class="msg msg-success"></div>
  <form id="reset-form" onsubmit="handleReset(event)">
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="new-password" required minlength="8" />
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm-password" required minlength="8" />
    </div>
    <button type="submit" class="btn" id="reset-btn">Reset Password</button>
  </form>
  <a href="/app.html" class="back-link">← Back to Sign In</a>
</div>

<script>
  // Environment detection — MANDATORY for standalone pages (pitfall #36)
  const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? 'http://localhost:3000'
    : 'https://7crb0oaiba.execute-api.us-east-1.amazonaws.com';

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (!token) {
    document.getElementById('msg-error').textContent = 'No reset token found. Request a new reset link.';
    document.getElementById('msg-error').style.display = 'block';
    document.getElementById('reset-form').style.display = 'none';
  }

  async function handleReset(e) {
    e.preventDefault();
    const pw = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    const errorEl = document.getElementById('msg-error');
    const successEl = document.getElementById('msg-success');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    if (pw !== confirm) {
      errorEl.textContent = 'Passwords do not match.';
      errorEl.style.display = 'block';
      return;
    }

    const btn = document.getElementById('reset-btn');
    btn.textContent = 'Resetting…'; btn.disabled = true;

    try {
      const res = await fetch(`${API_URL}/api/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Reset failed');

      document.getElementById('reset-form').style.display = 'none';
      successEl.textContent = 'Password reset! Redirecting to sign in…';
      successEl.style.display = 'block';
      setTimeout(() => { window.location.href = '/app.html'; }, 2000);
    } catch (err) {
      errorEl.textContent = err.message || 'Reset failed. Try requesting a new link.';
      errorEl.style.display = 'block';
      btn.textContent = 'Reset Password'; btn.disabled = false;
    }
  }
</script>
</body>
</html>
